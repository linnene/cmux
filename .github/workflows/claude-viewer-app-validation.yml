name: Fork tagged Claude viewer app
on:
  push:
    branches: [codex/claude-viewer-app-validation]
permissions:
  contents: read
jobs:
  tagged-app:
    if: github.repository == 'linnene/cmux'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      CMUX_DEV_BACKEND_MODE: local
      CMUX_RELOAD_NO_GLOBAL_CLI_LINKS: '1'
      CMUX_GHOSTTYKIT_PREPROVISIONED: '1'
      CMUX_SKIP_ZIG_BUILD: '1'
      GHOSTTYKIT_DOWNLOAD_RETRIES: '3'
      GHOSTTYKIT_DOWNLOAD_MAX_TIME: '180'
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh
      - name: Fetch native build inputs
        run: git submodule update --init --depth 1 vendor/bonsplit ghostty
      - name: Fetch pinned GhosttyKit
        run: ./scripts/download-prebuilt-ghosttykit.sh
      - name: Prepare toolchains
        run: |
          ./scripts/install-zig-ci.sh
          ./scripts/install-rust-ci.sh
      - name: Set up pinned TUI Rust
        uses: ./.github/actions/setup-cmux-tui-rust
      - name: Cache native build inputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cmux-tui/target
          key: viewer-tui-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cmux-tui/Cargo.lock', 'cmux-tui/rust-toolchain.toml') }}
      - name: Build snapshot TUI client
        working-directory: cmux-tui
        run: cargo build -p cmux-tui --bin cmux-tui --locked
      - name: Build tagged app
        run: CMUX_TUI_CLIENT_LOCAL="$PWD/cmux-tui/target/debug/cmux-tui" CMUX_SOURCE_PACKAGES_DIR="$RUNNER_TEMP/viewer-app-spm" ./scripts/reload.sh --tag claude-viewer-31224 --derived-data "$RUNNER_TEMP/viewer-app-dd"
      - name: Package tagged app
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/viewer-app-dd/Build/Products/Debug/cmux DEV claude-viewer-31224.app"
          test -x "$APP/Contents/MacOS/cmux DEV"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist" | grep -Fx com.cmuxterm.app.debug.claude-viewer-31224
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/claude-viewer-31224.zip"
          shasum -a 256 "$RUNNER_TEMP/claude-viewer-31224.zip" > "$RUNNER_TEMP/claude-viewer-31224.sha256"
      - name: Upload tagged validation app
        uses: actions/upload-artifact@v4
        with:
          name: claude-viewer-31224-app
          path: |
            ${{ runner.temp }}/claude-viewer-31224.zip
            ${{ runner.temp }}/claude-viewer-31224.sha256
          retention-days: 3
          if-no-files-found: error
